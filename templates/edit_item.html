{% extends "base.html" %}

{% block title %}Objekt bearbeiten - LocalLend{% endblock %}

{% block content %}
<div class="container mt-4 pt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="custom-card">
                <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                    <div class="bg-warning-subtle text-warning rounded-circle d-inline-flex p-3 me-3">
                        <i class="bi bi-pencil-square fs-3"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold mb-0">Objekt bearbeiten</h2>
                        <p class="text-secondary mb-0">Aktualisiere die Details deines Angebots.</p>
                    </div>
                </div>

                <form action="{{ url_for('edit_item', item_id=item.item_id) }}" method="POST">
                <!-- Formular zum Bearbeiten der Objektdaten -->
                    <div class="mb-4">
                        <label for="name" class="form-label fw-semibold">Name von dem Objekt</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ item.title }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Beschreibung</label>
                        <textarea class="form-control" id="description" name="description" rows="4"
                            required>{{ item.description }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="category" class="form-label fw-semibold">Kategorie</label>
                            <select class="form-select form-control" id="category" name="category" required>
                                <option value="Werkzeug" {% if item.category=='Werkzeug' %}selected{% endif %}>Werkzeuge
                                </option>
                                <option value="Technik" {% if item.category=='Technik' %}selected{% endif %}>Technik
                                </option>
                                <option value="Haushalt" {% if item.category=='Haushalt' %}selected{% endif %}>Haushalt
                                </option>
                                <option value="Garten" {% if item.category=='Garten' %}selected{% endif %}>Garten
                                </option>
                                <option value="Sport" {% if item.category=='Sport' %}selected{% endif %}>Sport &
                                    Freizeit</option>
                                <option value="Bücher" {% if item.category=='Bücher' %}selected{% endif %}>Bücher
                                </option>
                                <option value="Sonstiges" {% if item.category=='Sonstiges' %}selected{% endif %}>Sonstiges
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4 p-3 bg-light rounded border">
                        <!-- Status-Toggle (verfuegbar/nicht verfuegbar) -->
                        <label class="form-label fw-semibold mb-2">Aktueller Status</label>
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" role="switch" id="status" name="status"
                                value="available" {% if item.availability=='available' %}checked{% endif %}>
                            <label class="form-check-label" for="status">Sofort verfuegbar zum Verleihen</label>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <!-- Separates Formular fuer den Loeschen-Button -->
                        <form action="{{ url_for('delete_item', item_id=item.item_id) }}" method="POST"
                              onsubmit="return confirm('Bist du sicher, dass du dieses Objekt loeschen moechtest?');">
                            <button type="submit" class="btn btn-outline-danger btn-custom">
                                <i class="bi bi-trash"></i> Objekt loeschen
                            </button>
                        </form>

                        <div>
                            <a href="/profile" class="btn btn-outline-secondary btn-custom me-2">Abbrechen</a>
                            <button type="submit" class="btn btn-warning btn-custom px-4">
                                <i class="bi bi-save"></i> Aenderungen speichern
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
